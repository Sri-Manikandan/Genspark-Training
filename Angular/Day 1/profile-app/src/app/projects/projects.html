<section id="projects" class="bg-gray-50 text-gray-900 py-20 px-8">
  <div class="max-w-5xl mx-auto">
    <h2 class="text-3xl font-bold text-center mb-12">Projects</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (project of projects; track project.title) {
        <div class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-4 shadow-sm">
          <h3 class="text-xl font-semibold">{{ project.title }}</h3>
          <p class="text-gray-500 text-sm flex-1">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2">
            @for (tag of project.tags; track tag) {
              <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full">{{ tag }}</span>
            }
          </div>
          <button class="mt-2 border border-cyan-600 text-cyan-600 hover:bg-cyan-600 hover:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
            View
          </button>
        </div>
      }
    </div>
  </div>
</section>
