<section id="skills" class="bg-white text-gray-900 py-20 px-8">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-3xl font-bold text-center mb-12">Skills</h2>
    <div class="flex flex-wrap justify-center gap-4">
      @for (skill of skills; track skill) {
        <span class="border border-cyan-600 text-cyan-600 bg-cyan-50 px-6 py-2 rounded-full font-medium text-sm">
          {{ skill }}
        </span>
      }
    </div>
  </div>
</section>
